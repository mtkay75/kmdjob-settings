.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-text); }
.summary { margin: 10px 2px 0; font-size: 13px; color: var(--hint); }
.summary b { color: var(--text); font-weight: 600; }

.tools input { flex: 1; min-width: 0; }
.tools button { flex: none; }

.head .name { flex: 1; font-weight: 600; }
.head .count { font-size: 13px; color: var(--hint); }
.chev { color: var(--hint); transition: transform .15s; }
.card.open .chev { transform: rotate(90deg); }
.box { width: 22px; height: 22px; flex: none; border-radius: 6px; border: 2px solid var(--hint);

.box.on { background: var(--accent); border-color: var(--accent); }

.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.chip .plus { opacity: .7; margin-right: 1px; }
.legend { font-size: 12px; color: var(--hint); margin: 6px 2px 0; }

</section>

<div id="fallback" class="hidden">

    sum.appendChild(document.createTextNode(kv[0] + " "));
    var b = document.createElement("b"); b.textContent = kv[1]; sum.appendChild(b);
  });
  var empty = !on.slice(0, nPos).some(Boolean) || !on.slice(nPos).some(Boolean);
  showNotice(!tableOk ? "봇과 이 화면의 지역 표가 다릅니다. 봇이 보낸 버튼을 다시 눌러 열어 주십시오."
    : !loaded ? "지금 설정을 읽지 못했습니다. 텔레그램의 [감시 지역 변경] 버튼으로 열어 주십시오."
    : empty ? "지역이나 포지션이 하나도 없으면 알림이 나가지 않습니다." : "");
}
function showNotice(t) {
  var n = document.getElementById("notice");
  n.textContent = t;
  n.classList.toggle("hidden", !t);
}
function changed() {
  dirty = true;
  if (tg && tg.enableClosingConfirmation) tg.enableClosingConfirmation();
  paint();
}

// ---- 찾기 ----
document.getElementById("q").addEventListener("input", function () {
  var q = this.value.trim();
  cardEls.forEach(function (c) {
    var any = false;
    c.r.p.concat(c.r.x).forEach(function (u) {
      var hit = !q || DATA.units[u].indexOf(q) >= 0 || (c.r.label || c.r.name).indexOf(q) >= 0;
      (chipEls[u] || []).forEach(function (b) { if (b.parentNode === c.card.lastChild) b.classList.toggle("hidden", !hit); });
      any = any || hit;
    });
    c.card.classList.toggle("hidden", !!q && !any);
    if (q) c.card.classList.toggle("open", any);
  });
});

// ---- 탭 ----
function showTab(t) {
  var region = t !== "pos";
  document.getElementById("tab-region").setAttribute("aria-selected", region ? "true" : "false");
  document.getElementById("tab-pos").setAttribute("aria-selected", region ? "false" : "true");
  document.getElementById("page-region").classList.toggle("hidden", !region);
  document.getElementById("page-pos").classList.toggle("hidden", region);
  window.scrollTo(0, 0);
}
document.getElementById("tab-region").addEventListener("click", function () { showTab("region"); });
document.getElementById("tab-pos").addEventListener("click", function () { showTab("pos"); });
document.getElementById("all-on").addEventListener("click", function () { for (var u = 0; u < nUnit; u++) setUnit(u, true); changed(); });
document.getElementById("all-off").addEventListener("click", function () { for (var u = 0; u < nUnit; u++) setUnit(u, false); changed(); });
document.getElementById("pos-all").addEventListener("click", function () { for (var i = 0; i < nPos; i++) on[i] = true; changed(); });
document.getElementById("pos-none").addEventListener("click", function () { for (var i = 0; i < nPos; i++) on[i] = false; changed(); });

// ---- 저장 ----
function payload() { return JSON.stringify({ v: DATA.version, h: DATA.hash, s: encodeBits(on) }); }
function save() {
  if (!tableOk || !loaded) return;
  if (inTelegram) {
    if (tg.disableClosingConfirmation) tg.disableClosingConfirmation();
    tg.sendData(payload());          // 화면이 닫히고 봇이 web_app_data로 받는다
  }
}

// ---- 시작 ----
(function init() {
  var p = params();
  if (p.h && p.h !== DATA.hash) tableOk = false;
  if (p.s && tableOk) {
    try { on = decodeBits(p.s); loaded = true; } catch (e) { loaded = false; }
  }
  buildRegions();
  buildPositions();
  showTab(p.t === "pos" ? "pos" : "region");
  paint();
  if (inTelegram) {
    tg.ready();
    if (tg.expand) tg.expand();
    tg.MainButton.setText("저장");
    tg.MainButton.onClick(save);
    if (tableOk && loaded) tg.MainButton.show(); else tg.MainButton.hide();
  } else {
    var fb = document.getElementById("fallback");
    fb.classList.remove("hidden");
    document.getElementById("fallback-why").textContent = "텔레그램의 [감시 지역 변경]·[대상 포지션 변경] 버튼으로 열었을 때만 저장됩니다.";
  }
  window.__kmdjob = { payload: payload, save: save, state: function () { return on.slice(); } };
})();
</script>
</body>
</html>
